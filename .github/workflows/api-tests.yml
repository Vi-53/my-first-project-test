name: API tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API test framework
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for Ruff
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies for lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: |
          ruff check .
      
      - name: Prepare env file
        run: |
          cat <<EOF > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB_AUTH=auth_db
          POSTGRES_DB_UNIVERSITY=university_db
          AUTH_SERVICE_INTERNAL_URL=http://auth-service:8000
          AUTH_SERVICE_API_URL=http://127.0.0.1:8000
          EOF

      - name: Start tested system with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for tested services
        run: |
          python - <<'PY'
          import socket
          import time

          services = [
              ("auth-service", "127.0.0.1", 8000),
              ("university-service", "127.0.0.1", 8001),
          ]

          timeout_seconds = 120

          for service_name, host, port in services:
              print(f"Waiting for {service_name} on {host}:{port}...")
              deadline = time.time() + timeout_seconds

              while time.time() < deadline:
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          print(f"{service_name} is ready")
                          break
                  except OSError:
                      time.sleep(2)
              else:
                  raise TimeoutError(
                      f"{service_name} was not ready after {timeout_seconds} seconds"
                  )
          PY

      - name: Build test Docker image
        run: |
          docker build -t backend-api-tests -f Dockerfile.tests .

      - name: Run tests in Docker
        run: |
          mkdir -p allure-results

          set +e
          docker run \
            --rm \
            --network host \
            -v "${{ github.workspace }}/allure-results:/app/allure-results" \
            backend-api-tests

          echo $? > pytest_exit_code.txt
          set -e

      - name: Show Docker Compose logs
        if: always()
        run: |
          docker compose logs

      - name: Stop tested system
        if: always()
        run: |
          docker compose down -v

      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install -g allure-commandline

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<html><body><h1>No Allure results were generated</h1></body></html>" > allure-report/index.html
          fi

      - name: Upload Allure report artifact for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Fail job if tests failed
        if: always()
        run: |
          if [ -f pytest_exit_code.txt ]; then
            exit "$(cat pytest_exit_code.txt)"
          fi

  deploy-report:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: api-tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
