name: API tests

on:

  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Run Ruff linter
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for Ruff
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies for lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff linter
        run: |
          python -m ruff check .

  api-tests:
    name: Run API tests
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare env file
        run: |
          cat <<EOF > .env
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB_AUTH=${{ vars.POSTGRES_DB_AUTH }}
          POSTGRES_DB_UNIVERSITY=${{ vars.POSTGRES_DB_UNIVERSITY }}
          AUTH_SERVICE_INTERNAL_URL=${{ vars.AUTH_SERVICE_INTERNAL_URL }}
          AUTH_SERVICE_API_URL=${{ vars.AUTH_SERVICE_API_URL }}
          UNIVERSITY_SERVICE_API_URL=${{ vars.UNIVERSITY_SERVICE_API_URL }}
          UNIVERSITY_SERVICE_INTERNAL_URL=${{ vars.UNIVERSITY_SERVICE_INTERNAL_URL }}
          EOF

      - name: Start tested system with Docker Compose
        run: |
          docker compose up -d --build

      - name: Build test Docker image
        run: |
          docker build \
            -t backend-api-tests \
            -f Dockerfile.tests \
            .

      - name: Run tests in Docker
        run: |
          mkdir -p allure-results
          
          docker run \
            --rm \
            --network host \
            -v "${{ github.workspace }}/allure-results:/app/allure-results" \
            backend-api-tests

      - name: Show Docker Compose logs
        if: always()
        run: |
          docker compose logs

      - name: Stop tested system
        if: always()
        run: |
          docker compose down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  allure-report:
    name: Generate Allure report
    runs-on: ubuntu-latest
    needs: api-tests
    if: always() && needs.api-tests.result != 'skipped'

    permissions:
      contents: read

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install -g allure-commandline

      - name: Generate Allure report
        run: |
          allure generate \
            allure-results \
            --clean \
            -o allure-report

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload Allure report artifact for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: allure-report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
